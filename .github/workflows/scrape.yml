name: Scrape Telegram API

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom

      - name: Scrape Telegram API
        run: php bin/scrape.php

      - name: Commit updated JSON if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add telegram-api.json
          git diff --cached --quiet && echo "No changes." || (
            git commit -m "chore: update Telegram API data [skip ci]" &&
            git push
          )
